<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Gestión Académica GAUD</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                <div class="logo-icon">
                    <img src="icon/icon-web.png" alt="GAUD">
                </div>
                <h1>Gestión Académica</h1>
                <p>Crea tu cuenta para comenzar</p>
            </div>

            <form action="#" method="post">

                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="Ej. ejemplo@email.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="universidad">Universidad</label>
                    <select id="universidad" name="universidad">
                        <option value="">Selecciona tu universidad</option>
                        <option value="uapa">Universidad Abierta Para Adultos (UAPA)</option>
                        <option value="otro">Otra (Próximamente)</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="carrera">Carrera</label>
                        <select id="carrera" name="carrera">
                            <option value="">Selecciona tu carrera</option>
                            <option value="software">Ingeniería de Software</option>
                            <option value="informatica">Informática Gerencial</option>
                            <option value="ciencia">Ciencia de Datos</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Crea una contraseña" autocomplete="new-password">
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmar-password">Confirmar contraseña</label>
                    <input type="password" id="confirmar-password" name="confirmar-password" placeholder="Repite tu contraseña" autocomplete="new-password">
                </div>

                <div class="form-options">
                    <label>
                        <input type="checkbox" id="terminos" name="terminos">
                        Acepto los términos y condiciones
                    </label>
                </div>

                <button type="submit" class="btn btn-primary">Crear cuenta</button>

            </form>

            <div class="auth-footer">
                ¿Ya tienes una cuenta? <a href="index.html">Inicia sesión</a>
            </div>

        </div>

    </div>

</body>
</html>
