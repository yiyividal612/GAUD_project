<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Gestión Académica GAUD</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                <div class="logo-icon">
                    <img src="icon/icon-web.png" alt="GAUD">
                </div>
                <h1>Gestión Académica</h1>
                <p>Inicia sesión en tu cuenta</p>
            </div>

            <form action="#" method="post">

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@gmail.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                </div>

                <div class="form-options">
                    <label>
                        <input type="checkbox" id="remember" name="remember">
                        recordarme
                    </label>
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn btn-primary">Iniciar sesión</button>

            </form>

            <div class="auth-footer">
                ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
            </div>
            <div class="auth-footer">
                Puerta trasera para pruebas <a href="dashboard-tommisan.html">Click aquí</a>
            </div>
        </div>

    </div>

</body>
</html>
